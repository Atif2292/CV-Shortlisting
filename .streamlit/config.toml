[server]
headless = true
# CORS and XSRF protection stay ON (Streamlit defaults) so other sites can't drive user sessions.
# Hard upload cap per file in MB; the app enforces a lower per-file limit (MAX_FILE_MB).
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
