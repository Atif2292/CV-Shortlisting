name: Keep-alive & uptime check

# Free-tier Streamlit apps sleep when idle; this pings the app every 10 minutes and
# FAILS (so GitHub emails you) when the app doesn't respond.
# Optional: set the repository variable APP_URL if the app URL changes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping app and health endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://cv-shortlisting-heyjnwnkxygbb9saat9jjs.streamlit.app' }}
        run: |
          URL="${APP_URL%/}"
          APP=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$URL/")
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$URL/~/+/_stcore/health")
          echo "app=$APP health=$HEALTH at $(date -u)"
          if [ "$HEALTH" = "200" ] || [ "$APP" = "200" ] || [ "$APP" = "303" ]; then
            echo "App is up."
          else
            echo "::error::App did not respond (app=$APP health=$HEALTH)"
            exit 1
          fi
